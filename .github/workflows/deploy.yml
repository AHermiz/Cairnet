name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs to read the repo and mint an id-token for the deploy step.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel a run that is mid-publish: cancel-in-progress
# here can leave the Pages site half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      # npm run build ends in scripts/verify-out.mjs, which fails the build if
      # out/CNAME is missing or does not read exactly cairnetint.com. Without that
      # file GitHub Pages drops the custom domain and cairnetint.com starts serving
      # a 404. Checking it here means a broken build never reaches the deploy step.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
